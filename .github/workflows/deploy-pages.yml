# Publishes the website (the web/ folder) to GitHub Pages on every push to main.
# It copies web/ to the gh-pages branch, which GitHub Pages serves at
# https://<your-username>.github.io/<repository-name>/
# If the site does not appear: Settings -> Pages -> Build and deployment ->
# Source "Deploy from a branch", Branch "gh-pages" and "/ (root)" -> Save.
name: Publish website to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy the website to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r web /tmp/site
          cd /tmp/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
