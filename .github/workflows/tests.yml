# Trains the models from the data and checks that the Flask API, the Python estimator,
# the website JavaScript and the Java app all give the same answers.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Train the models and build the data
        run: python run_all.py
      - name: Run the tests
        env:
          NO_BROWSER: "1"
        run: python tests/test_api.py
